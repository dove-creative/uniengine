[package]
name = "uniengine-rapier2d-f32-probe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "uniengine_rapier2d_f32_probe"
path = "../src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["dim2", "f32"]
dim2 = []
f32 = []

[dependencies]
rapier = { package = "rapier2d", version = "=0.36.1" }
parry = { package = "parry2d", version = "=0.31.1" }

